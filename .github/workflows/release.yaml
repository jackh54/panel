name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc
      - name: create release branch and bump version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BRANCH=release/${{ env.VERSION }}
          git config --local user.email 'ci@pterodactyl.io'
          git config --local user.name 'Pterodactyl CI'
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          sed -i "s/'canary'/'${VERSION:1}'/" config/app.php
          git add config/app.php
          git commit -m 'ci(release): bump version'
          git push
      - name: build frontend (upload source maps to Sentry)
        env:
          VERSION: ${{ github.ref_name }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          export SENTRY_RELEASE="panel@${VERSION#v}"
          export SENTRY_ORG="${SENTRY_ORG:-pandascript}"
          export SENTRY_PROJECT="${SENTRY_PROJECT:-pandascript-panel}"
          yarn build:production
      - name: create release archive
        run: |
          rm -rf node_modules tests CONTRIBUTING.md flake.lock flake.nix phpunit.xml shell.nix
          # Never ship source maps in the tarball (defense in depth if upload was skipped)
          find public/assets -name '*.map' -delete 2>/dev/null || true
          tar -czf panel.tar.gz * .editorconfig .env.example .eslintignore .eslintrc.js .gitignore .prettierrc.json
      - name: write changelog
        run: |
          sed -n "/^## ${{ github.ref_name }}/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG
      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            panel.tar.gz
